name: Build and test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulseboard_ci
          POSTGRES_USER: pulseboard_test
          POSTGRES_PASSWORD: local-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseboard_test -d pulseboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PULSEBOARD_TEST_POSTGRES: Host=localhost;Port=5432;Database=pulseboard_ci;Username=pulseboard_test;Password=local-ci-only-password;SSL Mode=Disable
    defaults:
      run:
        working-directory: PulseBoard-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PulseBoard.sln
      - run: dotnet build PulseBoard.sln --configuration Release --no-restore
      - run: dotnet test PulseBoard.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PulseBoard-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: PulseBoard-Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
